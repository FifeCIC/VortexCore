<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"
     role="img" aria-labelledby="gcTitle gcDesc">
  <title id="gcTitle">Centrifugal force required to separate microplastics, by particle size and polymer</title>
  <desc id="gcDesc">Log-log chart. The horizontal axis is particle diameter from 1 to 100 micrometres. The vertical
  axis is the centrifugal force required, from 10 to 1,000,000 G. Three straight lines show the requirement for
  PET and PVC, for polypropylene, and for polyethylene. A shaded band across the plot at 2,500 to 3,000 G marks the
  design point of the proposed device. Where a line passes above that band the design point is not enough. The lines
  cross the band at 4.4 micrometres for PET, 8.9 for polypropylene and 12 for polyethylene, so buoyant polymers are
  separable only at considerably larger particle sizes.</desc>

  <style>
    .tick   { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #6c6c7e; }
    .series { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #1C2E4A; }
    .cross  { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #1C2E4A; }
    .axis   { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #4a4a5a; }
    .bandlab { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #44661a; }
    .zonelab { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #8a6520; }
    .ver    { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #98a2b0; }

    .grid   { stroke: #e6eaee; stroke-width: 1; }
    .frame  { fill: none; stroke: #c3ccd6; stroke-width: 1.2; }
    .leader { stroke: #c3ccd6; stroke-width: 1; }
    .drop   { stroke: #b8c2ce; stroke-width: 1; stroke-dasharray: 3 3; }
    .unreach { fill: #C4A882; opacity: .10; }
    .band   { fill: #8DC63F; opacity: .40; stroke: #74a832; stroke-width: 1; }
  </style>

  <!-- version stamp, inside the artwork -->
  <text class="ver" x="976" y="30" text-anchor="end">Chart v1, 27 Sep 2026</text>

  <!-- region above the design point -->
  <rect class="unreach" x="120" y="70" width="720" height="181.6"/>
  <text class="zonelab" x="130" y="88">above the design point: not separable</text>

  <!-- grid -->
  <line class="grid" x1="120" y1="430.0" x2="840" y2="430.0"/>
  <line class="grid" x1="120" y1="358.0" x2="840" y2="358.0"/>
  <line class="grid" x1="120" y1="286.0" x2="840" y2="286.0"/>
  <line class="grid" x1="120" y1="214.0" x2="840" y2="214.0"/>
  <line class="grid" x1="120" y1="142.0" x2="840" y2="142.0"/>
  <line class="grid" x1="120" y1="70.0" x2="840" y2="70.0"/>
  <line class="grid" x1="120.0" y1="70" x2="120.0" y2="430"/>
  <line class="grid" x1="228.4" y1="70" x2="228.4" y2="430"/>
  <line class="grid" x1="371.6" y1="70" x2="371.6" y2="430"/>
  <line class="grid" x1="480.0" y1="70" x2="480.0" y2="430"/>
  <line class="grid" x1="588.4" y1="70" x2="588.4" y2="430"/>
  <line class="grid" x1="731.6" y1="70" x2="731.6" y2="430"/>
  <line class="grid" x1="840.0" y1="70" x2="840.0" y2="430"/>

  <!-- design band -->
  <rect class="band" x="120" y="251.6" width="720" height="5.7"/>
  <text class="bandlab" x="832" y="244.6" text-anchor="end">design point 2,500 to 3,000 G</text>

  <!-- the three requirement lines -->
  <line x1="120.0" y1="165.3" x2="781.8" y2="430.0" stroke="#1C2E4A" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="120.0" y1="120.3" x2="840.0" y2="408.3" stroke="#2a9bc4" stroke-width="2" stroke-linecap="round"/>
  <line x1="120.0" y1="100.3" x2="840.0" y2="388.3" stroke="#C4A882" stroke-width="2" stroke-linecap="round"/>

  <!-- crossings -->
  <line class="drop" x1="350.2" y1="254.5" x2="350.2" y2="260"/>
  <circle cx="350.2" cy="254.5" r="4.5" fill="#1C2E4A" stroke="#ffffff" stroke-width="1.5"/>
  <text class="cross" x="350.2" y="278" text-anchor="middle">4.4 µm</text>
  <line class="drop" x1="462.6" y1="254.5" x2="462.6" y2="260"/>
  <circle cx="462.6" cy="254.5" r="4.5" fill="#2a9bc4" stroke="#ffffff" stroke-width="1.5"/>
  <text class="cross" x="462.6" y="278" text-anchor="middle">8.9 µm</text>
  <line class="drop" x1="512.7" y1="254.5" x2="512.7" y2="280"/>
  <circle cx="512.7" cy="254.5" r="4.5" fill="#C4A882" stroke="#ffffff" stroke-width="1.5"/>
  <text class="cross" x="512.7" y="298" text-anchor="middle">12 µm</text>

  <!-- series key -->
  <line x1="146" y1="356" x2="172" y2="356" stroke="#1C2E4A" stroke-width="3" stroke-linecap="round"/>
  <text class="series" x="180" y="360">PET / PVC</text>
  <line x1="146" y1="380" x2="172" y2="380" stroke="#2a9bc4" stroke-width="3" stroke-linecap="round"/>
  <text class="series" x="180" y="384">Polypropylene</text>
  <line x1="146" y1="404" x2="172" y2="404" stroke="#C4A882" stroke-width="3" stroke-linecap="round"/>
  <text class="series" x="180" y="408">Polyethylene</text>

  <!-- axes -->
  <rect class="frame" x="120" y="70" width="720" height="360"/>
  <text class="tick" x="110" y="434.0" text-anchor="end">10</text>
  <text class="tick" x="110" y="362.0" text-anchor="end">100</text>
  <text class="tick" x="110" y="290.0" text-anchor="end">1,000</text>
  <text class="tick" x="110" y="218.0" text-anchor="end">10,000</text>
  <text class="tick" x="110" y="146.0" text-anchor="end">100,000</text>
  <text class="tick" x="110" y="74.0" text-anchor="end">1,000,000</text>
  <text class="tick" x="120.0" y="450" text-anchor="middle">1</text>
  <text class="tick" x="228.4" y="450" text-anchor="middle">2</text>
  <text class="tick" x="371.6" y="450" text-anchor="middle">5</text>
  <text class="tick" x="480.0" y="450" text-anchor="middle">10</text>
  <text class="tick" x="588.4" y="450" text-anchor="middle">20</text>
  <text class="tick" x="731.6" y="450" text-anchor="middle">50</text>
  <text class="tick" x="840.0" y="450" text-anchor="middle">100</text>
  <text class="axis" x="480" y="534" text-anchor="middle">particle diameter (micrometres, log scale)</text>
  <text class="axis" x="40" y="250" text-anchor="middle" transform="rotate(-90 40 250)">centrifugal force required (G, log scale)</text>
</svg>
