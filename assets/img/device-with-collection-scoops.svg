<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" width="680" height="510"
     role="img" aria-labelledby="csTitle csDesc">
  <title id="csTitle">Hydrocyclone with wall-mounted collection scoops</title>
  <desc id="csDesc">Cross-section of a hydrocyclone. Water spirals down the outer wall carrying dense plastics,
  which are caught by a scoop and slot on each side of the cone and collected in troughs. Light plastics ride the
  rising inner vortex out through the vortex finder.</desc>

  <style>
    .th { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #1C2E4A; }
    .ts { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #6c6c7e; }
    .ver { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #98a2b0; }

    .body  { fill: #eaf4fa; }
    .duct  { fill: #ffffff; }
    .wall  { fill: none; stroke: #1C2E4A; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .scoop { fill: #AFA9EC; fill-opacity: 0.35; stroke: #1C2E4A; stroke-width: 1.5; stroke-linejoin: round; }
    .lip   { stroke: #1C2E4A; stroke-width: 3.5; stroke-linecap: round; }
    .arr   { stroke: #1C2E4A; stroke-width: 1.5; fill: none; }
    .leader{ stroke: #b8c2ce; stroke-width: 1; fill: none; }
    .swirl { fill: none; stroke: #44B8E0; stroke-width: 0.9; opacity: 0.65; stroke-dasharray: 4 4; }

    .dn { fill: none; stroke: #44B8E0; stroke-width: 1.6; }
    .up { fill: none; stroke: #44B8E0; stroke-width: 1.6; }

    /* The still set exists only for readers who ask for less motion. */
    #p-static { display: none; }

    @keyframes fl { to { stroke-dashoffset: -16 } }
    @keyframes fu { to { stroke-dashoffset: 16 } }
    @media (prefers-reduced-motion: no-preference) {
      .dn { stroke-dasharray: 5 4; animation: fl 1.1s linear infinite; }
      .up { stroke-dasharray: 5 4; animation: fu 0.9s linear infinite; }
    }
    @media (prefers-reduced-motion: reduce) {
      #p { display: none; }
      #p-static { display: block; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- vessel, feed duct and underflow stub -->
  <polygon class="body" points="190,130 420,130 420,220 320,400 290,400 190,220"/>
  <rect class="body" x="40" y="156" width="150" height="30"/>
  <rect class="body" x="290" y="400" width="30" height="30"/>

  <!-- vortex finder and overflow duct -->
  <polygon class="duct" points="275,58 560,58 560,92 335,92 335,212 275,212"/>

  <!-- one swirl plane per turn of the descending spiral -->
  <ellipse class="swirl" cx="305" cy="185" rx="105" ry="13"/>
  <ellipse class="swirl" cx="305" cy="262" rx="82" ry="10"/>
  <ellipse class="swirl" cx="305" cy="350" rx="38" ry="7"/>

  <!-- direct routes, as supplied: the descending outer stream and the rising core -->
  <path class="dn" d="M208 190 L240 284" marker-end="url(#arrow)"/>
  <path class="dn" d="M402 190 L370 284" marker-end="url(#arrow)"/>
  <path class="up" d="M305 300 L305 100" marker-end="url(#arrow)"/>

  <!-- vessel wall -->
  <g class="wall">
  <path d="M190 220 L190 186 M190 156 L190 130 L420 130 L420 220"/>
  <path d="M190 220 L232 296 M244 318 L290 400 L290 430"/>
  <path d="M420 220 L378 296 M366 318 L320 400 L320 430"/>
  <path d="M190 156 L40 156 M40 186 L190 186"/>
  <path d="M275 212 L275 58 L560 58 M560 92 L335 92 L335 212"/>
  </g>

  <!-- collection scoops and their lips -->
  <path class="scoop" d="M232 296 L198 296 L198 344 L259 344 L244 318"/>
  <path class="scoop" d="M378 296 L412 296 L412 344 L351 344 L366 318"/>
  <path class="lip" d="M252 292 L244.5 318"/>
  <path class="lip" d="M358 292 L365.5 318"/>

  <!-- outlet arrows -->
  <line class="arr" x1="198" y1="322" x2="46" y2="322" marker-end="url(#arrow)"/>
  <line class="arr" x1="412" y1="322" x2="560" y2="322" marker-end="url(#arrow)"/>
  <line class="arr" x1="560" y1="75" x2="606" y2="75" marker-end="url(#arrow)"/>
  <line class="arr" x1="305" y1="430" x2="305" y2="460" marker-end="url(#arrow)"/>

  <!-- particles: travelling set, then a still set for reduced-motion readers -->
  <g id="p">
    <circle cx="0" cy="0" r="4.5" fill="#534AB7" stroke="#fff" stroke-width="0.6" opacity="0">
      <animateMotion dur="6s" begin="0.00s" repeatCount="indefinite" path="M50 171 L205 171 Q198 200 200 225 L238 288 L243 304 L214 326"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="6s" begin="0.00s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4.5" fill="#534AB7" stroke="#fff" stroke-width="0.6" opacity="0">
      <animateMotion dur="6s" begin="-1.50s" repeatCount="indefinite" path="M50 171 L205 171 Q198 200 200 225 L238 288 L243 304 L214 326"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="6s" begin="-1.50s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4.5" fill="#534AB7" stroke="#fff" stroke-width="0.6" opacity="0">
      <animateMotion dur="6s" begin="-3.00s" repeatCount="indefinite" path="M50 171 L205 171 Q198 200 200 225 L238 288 L243 304 L214 326"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="6s" begin="-3.00s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4.5" fill="#534AB7" stroke="#fff" stroke-width="0.6" opacity="0">
      <animateMotion dur="6s" begin="-4.50s" repeatCount="indefinite" path="M50 171 L205 171 Q198 200 200 225 L238 288 L243 304 L214 326"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="6s" begin="-4.50s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4.5" fill="#534AB7" stroke="#fff" stroke-width="0.6" opacity="0">
      <animateMotion dur="6s" begin="0.00s" repeatCount="indefinite" path="M410 145 Q416 190 412 225 L372 288 L367 304 L396 326"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="6s" begin="0.00s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4.5" fill="#534AB7" stroke="#fff" stroke-width="0.6" opacity="0">
      <animateMotion dur="6s" begin="-1.50s" repeatCount="indefinite" path="M410 145 Q416 190 412 225 L372 288 L367 304 L396 326"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="6s" begin="-1.50s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4.5" fill="#534AB7" stroke="#fff" stroke-width="0.6" opacity="0">
      <animateMotion dur="6s" begin="-3.00s" repeatCount="indefinite" path="M410 145 Q416 190 412 225 L372 288 L367 304 L396 326"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="6s" begin="-3.00s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4.5" fill="#534AB7" stroke="#fff" stroke-width="0.6" opacity="0">
      <animateMotion dur="6s" begin="-4.50s" repeatCount="indefinite" path="M410 145 Q416 190 412 225 L372 288 L367 304 L396 326"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="6s" begin="-4.50s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3.5" fill="#EF9F27" stroke="#fff" stroke-width="0.6" opacity="0">
      <animateMotion dur="7s" begin="0.00s" repeatCount="indefinite" path="M50 171 L205 171 C235 185 250 240 305 250 L305 80 Q305 75 320 75 L590 75"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="7s" begin="0.00s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3.5" fill="#EF9F27" stroke="#fff" stroke-width="0.6" opacity="0">
      <animateMotion dur="7s" begin="-1.75s" repeatCount="indefinite" path="M50 171 L205 171 C235 185 250 240 305 250 L305 80 Q305 75 320 75 L590 75"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="7s" begin="-1.75s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3.5" fill="#EF9F27" stroke="#fff" stroke-width="0.6" opacity="0">
      <animateMotion dur="7s" begin="-3.50s" repeatCount="indefinite" path="M50 171 L205 171 C235 185 250 240 305 250 L305 80 Q305 75 320 75 L590 75"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="7s" begin="-3.50s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3.5" fill="#EF9F27" stroke="#fff" stroke-width="0.6" opacity="0">
      <animateMotion dur="7s" begin="-5.25s" repeatCount="indefinite" path="M50 171 L205 171 C235 185 250 240 305 250 L305 80 Q305 75 320 75 L590 75"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="7s" begin="-5.25s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g id="p-static">
    <circle cx="205" cy="171" r="4.5" fill="#534AB7" stroke="#fff" stroke-width="0.6"/>
    <circle cx="239" cy="292" r="4.5" fill="#534AB7" stroke="#fff" stroke-width="0.6"/>
    <circle cx="410" cy="145" r="4.5" fill="#534AB7" stroke="#fff" stroke-width="0.6"/>
    <circle cx="370" cy="293" r="4.5" fill="#534AB7" stroke="#fff" stroke-width="0.6"/>
    <circle cx="170" cy="171" r="3.5" fill="#EF9F27" stroke="#fff" stroke-width="0.6"/>
    <circle cx="305" cy="150" r="3.5" fill="#EF9F27" stroke="#fff" stroke-width="0.6"/>
    <circle cx="420" cy="75" r="3.5" fill="#EF9F27" stroke="#fff" stroke-width="0.6"/>
  </g>

  <!-- labels -->
  <text class="th" x="40" y="118">Feed inlet</text>
  <text class="ts" x="40" y="134">tangential, 2-5 m/s</text>
  <text class="ts" x="345" y="46">Overflow: water + light fraction</text>
  <text class="ts" x="40" y="310">Heavy fraction out</text>
  <text class="ts" x="470" y="310">Heavy fraction out</text>
  <line class="leader" x1="335" y1="120" x2="468" y2="120"/>
  <text class="th" x="476" y="124">Vortex finder</text>
  <line class="leader" x1="416" y1="205" x2="468" y2="205"/>
  <text class="th" x="476" y="209">Outer vortex</text>
  <text class="ts" x="476" y="225">water descending</text>
  <line class="leader" x1="312" y1="262" x2="468" y2="262"/>
  <text class="th" x="476" y="266">Inner vortex</text>
  <text class="ts" x="476" y="282">water rising, carries light</text>
  <line class="leader" x1="385" y1="344" x2="468" y2="372"/>
  <text class="th" x="476" y="376">Collection scoop</text>
  <text class="ts" x="476" y="392">lip diverts the outer stream</text>
  <line class="leader" x1="322" y1="415" x2="468" y2="436"/>
  <text class="th" x="476" y="440">Underflow</text>
  <text class="ts" x="476" y="456">water reject, few solids</text>

  <!-- legend -->
  <circle cx="60" cy="490" r="5" fill="#534AB7"/>
  <text class="ts" x="72" y="494">Heavy: PET, PVC</text>
  <circle cx="230" cy="490" r="5" fill="#EF9F27"/>
  <text class="ts" x="242" y="494">Light: PE, PP</text>
  <text class="ver" x="470" y="494">Scoop variant, v1 - 28 Sep 2026</text>
</svg>
