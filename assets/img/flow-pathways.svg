<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620"
     role="img" aria-labelledby="fpTitle fpDesc">
  <title id="fpTitle">Where each stream goes once it leaves the separation chamber</title>
  <desc id="fpDesc">Flow schematic. Feed enters the Vortex Core chamber. The underflow leaves the apex carrying
  the heavy fraction. The overflow leaves the top carrying water and the light fraction, and passes to a
  light-fraction skimmer. Skimmed light fraction joins the heavy fraction in the evaporation loop. The remaining
  water is polished and goes to the floors. The evaporation loop leaves dry plastic residue for recycling and
  condensed water returned to the clean side.</desc>

  <style>
    .num   { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #2a9bc4; }
    .name  { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1C2E4A; }
    .sub   { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #6c6c7e; }
    .flowlab { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #4a4a5a; }
    .panel-label { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #1C2E4A; }
    .panel-line  { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #4a4a5a; }
    .foot  { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #6c6c7e; }

    .box   { fill: #ffffff; stroke: #1C2E4A; stroke-width: 1.8; }
    .box-reject { fill: #fdf6ec; stroke: #C4A882; stroke-width: 1.8; }
    .panel { fill: #f6f8fa; stroke: #e2e6ea; stroke-width: 1; }
    .flow  { fill: none; stroke: #1C2E4A; stroke-width: 2; }
    .flow-warm { fill: none; stroke: #C4A882; stroke-width: 2; }
  </style>

  <defs>
    <marker id="fpArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1C2E4A"/>
    </marker>
    <marker id="fpArrowWarm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C4A882"/>
    </marker>
  </defs>

  <!-- feed in -->
  <path class="flow" d="M20,132 L84,132" marker-end="url(#fpArrow)"/>
  <text class="flowlab" x="52" y="116" text-anchor="middle">Feed</text>
  <text class="flowlab" x="52" y="152" text-anchor="middle">approx. 80 PSI</text>

  <!-- stage 1 -->
  <rect class="box" x="90" y="90" width="220" height="84" rx="8"/>
  <text class="num" x="106" y="114">1</text>
  <text class="name" x="200" y="130" text-anchor="middle">Vortex Core</text>
  <text class="sub" x="200" y="150" text-anchor="middle">separation chamber</text>

  <path class="flow" d="M310,132 L404,132" marker-end="url(#fpArrow)"/>
  <text class="flowlab" x="357" y="118" text-anchor="middle">overflow</text>

  <!-- stage 2 -->
  <rect class="box" x="410" y="90" width="220" height="84" rx="8"/>
  <text class="num" x="426" y="114">2</text>
  <text class="name" x="520" y="130" text-anchor="middle">Light-fraction skimmer</text>
  <text class="sub" x="520" y="150" text-anchor="middle">removes what the core carried out</text>

  <text class="flowlab" x="677" y="118" text-anchor="middle">water</text>

  <!-- stage 3 -->
  <rect class="box" x="730" y="90" width="220" height="84" rx="8"/>
  <text class="num" x="746" y="114">3</text>
  <text class="name" x="840" y="130" text-anchor="middle">Polishing</text>
  <text class="sub" x="840" y="150" text-anchor="middle">UV-C, optional carbon</text>

  <path class="flow" d="M950,132 L986,132" marker-end="url(#fpArrow)"/>
  <text class="sub" x="840" y="196" text-anchor="middle">to the floors below</text>

  <!-- stage 4 -->
  <rect class="box-reject" x="380" y="300" width="340" height="104" rx="8"/>
  <text class="num" x="396" y="324" fill="#8a7452">4</text>
  <text class="name" x="550" y="340" text-anchor="middle">Evaporation loop</text>
  <text class="sub" x="550" y="360" text-anchor="middle">treats both reject streams together</text>
  <text class="sub" x="550" y="378" text-anchor="middle">driven by the building's own waste heat</text>

  <!-- underflow from stage 1 -->
  <path class="flow" d="M200,174 L200,352 L374,352" marker-end="url(#fpArrow)"/>
  <text class="flowlab" x="212" y="252">underflow</text>
  <text class="flowlab" x="212" y="268">heavy fraction, PET and PVC</text>

  <!-- light fraction from stage 2 -->
  <path class="flow" d="M520,174 L520,294" marker-end="url(#fpArrow)"/>
  <text class="flowlab" x="532" y="240">light fraction, PE and PP</text>

  <!-- stage 4 outputs -->
  <path class="flow-warm" d="M550,404 L550,428" marker-end="url(#fpArrowWarm)"/>

  <rect class="panel" x="250" y="436" width="520" height="118" rx="8"/>
  <text class="panel-label" x="270" y="462">What leaves the evaporation loop</text>
  <text class="panel-line" x="270" y="490">Dry plastic residue &#8594; collection tray &#8594; recycling</text>
  <text class="panel-line" x="270" y="516">Evaporated water, condensed &#8594; returned to the clean side</text>
  <text class="panel-line" x="270" y="540">No liquid discharge</text>

  <text class="foot" x="500" y="596" text-anchor="middle">All four stages are design intent. Nothing has been built, and no stage has been tested.</text>
</svg>
